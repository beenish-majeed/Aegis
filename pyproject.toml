[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Framework-agnostic RAG Faithfulness Auditor"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Beenish Majeed" }
]

dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "numpy>=1.20.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4"
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["."]